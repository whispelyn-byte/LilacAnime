# Builds the app with Gradle (from ci/gradle, made from app/module.toml) and runs the unit tests. The debug APK it
# uploads installs beside the real app (application id com.lilac.anime.citest), for trying a change on a phone.
name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner's own Android SDK. compileSdk 37 as in module.toml when the SDK has it, else the newest one before it.
      - name: Android platform
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          ls "$ANDROID_HOME/platforms"
          yes | "$sdkmanager" --licenses > /dev/null || true
          if [ -d "$ANDROID_HOME/platforms/android-37" ] || "$sdkmanager" "platforms;android-37"; then
            [ -d "$ANDROID_HOME/platforms/android-37" ] && echo "CI_SDK=37" >> "$GITHUB_ENV"
          fi
          if ! grep -q CI_SDK "$GITHUB_ENV"; then
            [ -d "$ANDROID_HOME/platforms/android-36" ] || "$sdkmanager" "platforms;android-36"
            echo "CI_SDK=36" >> "$GITHUB_ENV"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Gradle build files
        run: |
          cp ci/gradle/settings.gradle.kts ci/gradle/build.gradle.kts ci/gradle/gradle.properties .
          cp ci/gradle/app/build.gradle.kts app/

      - name: Unit tests
        run: gradle :app:testDebugUnitTest -PciCompileSdk="$CI_SDK" --stacktrace

      - name: Debug APK
        run: gradle :app:assembleDebug -PciCompileSdk="$CI_SDK" --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: lilacanime-citest-apk
          path: app/build/outputs/apk/debug/*.apk
